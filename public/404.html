<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 · 页面不存在 · 月白ねむ</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/error.css" />
  </head>
  <body>
    <main class="card">
      <span class="badge">HTTP 404</span>
      <p class="code">404</p>
      <h1>页面不存在</h1>
      <p class="desc">你访问的地址可能已被移动、改名，或者从来没有存在过。</p>
      <div class="actions">
        <a class="btn primary" href="/">回到首页</a>
        <button class="btn" type="button" onclick="location.reload()">重新加载</button>
      </div>
      <p class="meta">月白ねむ · ASMR Creator</p>
    </main>
  </body>
</html>
