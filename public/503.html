<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>503 · 服务暂不可用 · maoyusu</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/error.css" />
    <meta http-equiv="refresh" content="30" />
  </head>
  <body>
    <main class="card">
      <span class="badge">HTTP 503</span>
      <p class="code">503</p>
      <h1>服务暂不可用</h1>
      <p class="desc">服务正在维护或负载过高，请稍后再试。页面会在 30 秒后自动重试。</p>
      <div class="actions">
        <a class="btn primary" href="/">回到首页</a>
        <button class="btn" type="button" onclick="location.reload()">立即重试</button>
      </div>
      <p class="hint">维护进度会发布在状态页</p>
      <p class="meta">maoyusu · Soft UI</p>
    </main>
  </body>
</html>
