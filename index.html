<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Soft UI 组件库 · Vite + React + TypeScript + Tailwind CSS" />
    <title>maoyusu · Soft UI 组件库</title>
    <script>
      // 首屏前应用主题，避免明暗切换闪白：light / dark / system（默认）
      ;(function () {
        try {
          var saved = localStorage.getItem('maoyusu-theme') || 'system'
          var dark =
            saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (error) {
          /* localStorage 不可用时忽略 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
